name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-build:
    name: Backend build & test（含 ArchUnit 静态检查 + 跨租户越权集成测试，均为一票否决项）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: ./mvnw -B compile

      - name: Test + Verify（单测/ArchUnit 走 surefire，*IT 跨租户集成测试走 failsafe，均阻断合并）
        run: ./mvnw -B verify

      - name: Upload surefire/failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/failsafe-reports/*.txt
