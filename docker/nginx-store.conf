# 商户后台（shop-ui/store）—— 静态资源 + 反代 /store/** 到 shop-store-api
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 商户要上传商品图/资质，放宽一点
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /store/ {
        proxy_pass http://store-api:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # 商户上传的图片。由 store-api 的 UploadResourceConfig 从共享卷 /data/uploads 提供，
    # 装修编辑器里的 <img src="/uploads/..."> 走这里。
    # 注意：不能被上面的静态资源 location（\.(js|css|png|jpg...)$）抢走——
    # nginx 中前缀 location 优先级低于正则 location，所以这里必须用 ^~ 强制前缀优先匹配，
    # 否则 /uploads/xx.png 会落到 root 下找不到文件而 404。
    location ^~ /uploads/ {
        proxy_pass http://store-api:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location /actuator/ {
        return 404;
    }
}
