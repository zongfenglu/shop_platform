# 宿主机 Nginx：按域名转到 Docker 映射出来的三个前端端口。
# 把下面所有 example.com 改成你的域名（与 docker/.env 里 PLATFORM_BASE_DOMAIN 一致）。
# Host 必须原样透传，H5 才能按域名识别租户。
#
# Debian/Ubuntu:
#   sudo apt-get install -y nginx
#   sudo cp docker/nginx/host.conf /etc/nginx/sites-available/shop-platform
#   sudo ln -sf /etc/nginx/sites-available/shop-platform /etc/nginx/sites-enabled/shop-platform
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx
#
# RHEL/CentOS/Rocky:
#   sudo yum install -y nginx
#   sudo cp docker/nginx/host.conf /etc/nginx/conf.d/shop-platform.conf
#   sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx

server {
    listen 80;
    server_name admin.example.com www.example.com example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

server {
    listen 80;
    server_name store.example.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# demo.example.com、其它店铺子域名、自定义域名都进 H5
server {
    listen 80 default_server;
    server_name demo.example.com _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
