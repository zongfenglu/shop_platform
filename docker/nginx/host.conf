# 宿主机 Nginx：按域名转到本机 Docker 前端端口。
# 不要手改这里的 __DOMAIN__ —— 改 docker/.env 的 PLATFORM_BASE_DOMAIN 后执行：
#   sudo bash docker/scripts/install-host-nginx.sh
#
# Host 必须原样透传，H5 才能按域名识别租户。

server {
    listen 80;
    server_name admin.__DOMAIN__ www.__DOMAIN__ __DOMAIN__;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

server {
    listen 80;
    server_name store.__DOMAIN__;

    client_max_body_size 50m;

    location / {
