<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>平台超管登录</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  body { background: linear-gradient(160deg, #12244a 0%, #1c3d6e 45%, #2a78d6 100%); min-height: 100vh; }
  .login-wrap { display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .login-box { width: 380px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-modal); padding: 36px 32px; }
  .login-logo { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; margin-bottom: 16px; }
  .login-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .login-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 26px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">火</div>
      <div class="login-title">多开云商城 · 平台超管</div>
      <div class="login-sub">管理全部租户商城 · 套餐 · 域名 · 客户端授权</div>
      <div class="form-item">
        <label class="form-label"><span class="req">*</span>管理员账号</label>
        <input class="form-input" value="admin" />
      </div>
      <div class="form-item">
        <label class="form-label"><span class="req">*</span>密码</label>
        <input class="form-input" type="password" value="••••••••" />
      </div>
      <a href="shop-list.html" class="btn btn-primary btn-block" style="height:38px;margin-top:6px;">登 录</a>
      <div class="form-hint" style="text-align:center;margin-top:14px;">演示环境 · 直接点击登录即可进入</div>
    </div>
  </div>
</body>
</html>
