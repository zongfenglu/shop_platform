<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>购物车</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .cart-item { display:flex; gap:10px; background:#fff; padding:12px 14px; border-bottom:1px solid var(--gridline); align-items:center; }
  .cart-ph { width:64px; height:64px; border-radius:8px; background:linear-gradient(135deg,#f3e7e0,#eadad0); display:flex;align-items:center;justify-content:center;font-size:22px;color:#c9b6a8; flex-shrink:0; }
  .cart-body { flex:1; min-width:0; }
  .cart-title { font-size:13px; line-height:1.4; margin-bottom:4px; }
  .cart-spec { font-size:11.5px; color:var(--text-muted); background:var(--surface-2); display:inline-block; padding:1px 6px; border-radius:4px; margin-bottom:6px; }
  .cart-foot { display:flex; align-items:center; justify-content:space-between; }
  .invalid-section { padding:10px 14px; font-size:12px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="phone-wrap"><div class="phone">
  <div class="phone-statusbar"><span>9:41</span><span>●●● 5G 🔋</span></div>
  <div class="m-navbar"><span class="back" onclick="history.back()">‹</span>购物车 (3)<span class="action">管理</span></div>

  <div class="phone-body">
    <div style="padding-top:1px;">
      <div class="cart-item">
        <div class="checkbox checked">✓</div>
        <div class="cart-ph">👗</div>
        <div class="cart-body">
          <div class="cart-title">法式碎花连衣裙 2026夏季新款</div>
          <div class="cart-spec">杏色 / M</div>
          <div class="cart-foot">
            <span class="price-tag"><span class="cny">¥</span>199</span>
            <div class="stepper"><button onclick="stepQty(this,-1)">－</button><span class="qty">1</span><button onclick="stepQty(this,1)">＋</button></div>
          </div>
        </div>
      </div>
      <div class="cart-item">
        <div class="checkbox checked">✓</div>
        <div class="cart-ph">🧥</div>
        <div class="cart-body">
          <div class="cart-title">羊毛混纺加厚大衣 秋冬新款</div>
          <div class="cart-spec">黑色 / L</div>
          <div class="cart-foot">
            <span class="price-tag"><span class="cny">¥</span>459</span>
            <div class="stepper"><button onclick="stepQty(this,-1)">－</button><span class="qty">1</span><button onclick="stepQty(this,1)">＋</button></div>
          </div>
        </div>
      </div>
      <div class="cart-item">
        <div class="checkbox" onclick="this.classList.toggle('checked'); this.textContent = this.classList.contains('checked') ? '✓' : '';"></div>
        <div class="cart-ph">🧣</div>
        <div class="cart-body">
          <div class="cart-title">真丝方巾礼盒装 送礼佳品</div>
          <div class="cart-spec">默认</div>
          <div class="cart-foot">
            <span class="price-tag"><span class="cny">¥</span>99</span>
            <div class="stepper"><button onclick="stepQty(this,-1)">－</button><span class="qty">2</span><button onclick="stepQty(this,1)">＋</button></div>
          </div>
        </div>
      </div>

      <div class="invalid-section">已失效商品 (1) · 超出购买时段</div>
      <div class="cart-item" style="opacity:.5;">
        <div class="checkbox"></div>
        <div class="cart-ph">👖</div>
        <div class="cart-body">
          <div class="cart-title">高腰直筒牛仔裤（活动已结束）</div>
          <div class="cart-spec">蓝色 / M</div>
        </div>
      </div>
    </div>
  </div>

  <div class="m-bottom-bar">
    <div class="checkbox checked" style="margin-right:4px;">✓</div>
    <span style="font-size:12.5px;">全选</span>
    <div style="flex:1;"></div>
    <div style="font-size:12px;">合计：<span class="price-tag" style="font-size:17px;">¥757</span></div>
    <a href="checkout.html" class="m-btn m-btn-warm" style="flex:none;padding:0 26px;">结算(2)</a>
  </div>
</div></div>

<script>
  function stepQty(btn, d) {
    const span = btn.parentElement.querySelector('.qty');
    span.textContent = Math.max(1, +span.textContent + d);
  }
</script>
</body>
</html>
