<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>确认订单</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .addr-card { background:#fff; margin:10px 14px; border-radius:10px; padding:14px; display:flex; gap:10px; box-shadow:var(--shadow-sm); position:relative; }
  .addr-card::after { content:""; position:absolute; left:14px; right:14px; bottom:-6px; height:6px; background:repeating-linear-gradient(90deg, var(--gridline) 0 6px, transparent 6px 12px); }
  .co-goods-row { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--gridline); align-items:center; }
  .co-goods-row:last-child { border-bottom:none; }
  .co-ph { width:52px; height:52px; border-radius:8px; background:linear-gradient(135deg,#f3e7e0,#eadad0); display:flex;align-items:center;justify-content:center;font-size:18px;color:#c9b6a8; flex-shrink:0; }
</style>
</head>
<body>
<div class="phone-wrap"><div class="phone">
  <div class="phone-statusbar"><span>9:41</span><span>●●● 5G 🔋</span></div>
  <div class="m-navbar"><span class="back" onclick="history.back()">‹</span>确认订单</div>

  <div class="phone-body">
    <div class="addr-card">
      <div style="font-size:18px;">📍</div>
      <div style="flex:1;">
        <div style="font-size:13.5px; font-weight:600; margin-bottom:4px;">张婷 138 0000 2231</div>
        <div style="font-size:12.5px; color:var(--text-secondary);">浙江省杭州市西湖区文三路90号东部软件园6幢502</div>
      </div>
      <div style="align-self:center; color:var(--text-muted);">›</div>
    </div>

    <div class="m-card-block">
      <div style="padding:12px 14px 4px; font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:6px;">🚚 快递配送
        <span style="margin-left:auto; color:var(--text-muted);">门店自提 ›</span>
      </div>
      <div style="padding:6px 14px 12px;">
        <div class="co-goods-row">
          <div class="co-ph">👗</div>
          <div style="flex:1;"><div style="font-size:12.5px;">法式碎花连衣裙 · 杏色/M</div></div>
          <div style="font-size:12.5px;">¥199 ×1</div>
        </div>
        <div class="co-goods-row">
          <div class="co-ph">🧥</div>
          <div style="flex:1;"><div style="font-size:12.5px;">羊毛混纺加厚大衣 · 黑色/L</div></div>
          <div style="font-size:12.5px;">¥459 ×1</div>
        </div>
      </div>
    </div>

    <div class="m-card-block">
      <div class="m-cell"><div class="l">优惠券</div><div class="r strong">满199减10 <span>›</span></div></div>
      <div class="m-cell"><div class="l">积分抵扣</div><div class="r">可用 320 分，抵¥3.2 <span>›</span></div></div>
      <div class="m-cell"><div class="l">买家留言</div><div class="r">请点击填写 <span>›</span></div></div>
    </div>

    <div class="m-card-block">
      <div class="m-cell"><div class="l">商品总额</div><div class="r">¥658.00</div></div>
      <div class="m-cell"><div class="l">运费</div><div class="r">¥0.00</div></div>
      <div class="m-cell"><div class="l">优惠券</div><div class="r" style="color:var(--price);">-¥10.00</div></div>
      <div class="m-cell"><div class="l">积分抵扣</div><div class="r" style="color:var(--price);">-¥3.20</div></div>
    </div>
  </div>

  <div class="m-bottom-bar">
    <div style="font-size:12px;">应付：<span class="price-tag" style="font-size:18px;">¥644.80</span></div>
    <div style="flex:1;"></div>
    <a href="pay-result.html" class="m-btn m-btn-warm" style="flex:none;padding:0 26px;">提交订单</a>
  </div>
</div></div>
</body>
</html>
