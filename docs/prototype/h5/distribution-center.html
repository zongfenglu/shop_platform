<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的分销</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .dc-hero { background:linear-gradient(135deg,#2b2b2b,#3d3d3d); color:#fff; padding:20px 16px; }
  .dc-asset-row { display:flex; margin-top:14px; }
  .dc-asset-row .item { flex:1; text-align:center; }
  .dc-asset-row .n { font-size:20px; font-weight:800; }
  .dc-asset-row .l { font-size:10.5px; opacity:.75; margin-top:2px; }
  .dc-shortcut { display:flex; background:#fff; margin:-14px 14px 0; border-radius:10px; box-shadow:var(--shadow-sm); padding:12px 0; position:relative; z-index:2; }
  .dc-shortcut .item { flex:1; text-align:center; font-size:11px; color:var(--text-secondary); }
  .dc-shortcut .ico { font-size:18px; display:block; margin-bottom:4px; }
  .team-item { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--gridline); }
  .team-avatar { width:32px;height:32px;border-radius:50%; background:linear-gradient(135deg,#ffb199,#e34948); color:#fff; font-size:12px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
</style>
</head>
<body>
<div class="phone-wrap"><div class="phone">
  <div class="phone-statusbar"><span>9:41</span><span>●●● 5G 🔋</span></div>
  <div class="m-navbar" style="background:#2b2b2b;color:#fff;"><span class="back" onclick="history.back()" style="color:#fff;">‹</span>我的分销</div>

  <div class="phone-body">
    <div class="dc-hero">
      <div style="font-size:12px; opacity:.85;">累计佣金</div>
      <div style="font-size:26px; font-weight:800;">¥3,240.00</div>
      <div class="dc-asset-row">
        <div class="item"><div class="n">¥1,860</div><div class="l">可提现</div></div>
        <div class="item"><div class="n">¥420</div><div class="l">冻结中</div></div>
        <div class="item"><div class="n">12</div><div class="l">我的团队</div></div>
      </div>
    </div>

    <div class="dc-shortcut">
      <a href="#" class="item"><span class="ico">💰</span>申请提现</a>
      <a href="#" class="item"><span class="ico">📊</span>佣金明细</a>
      <a href="#" class="item"><span class="ico">👥</span>我的团队</a>
      <a href="#" class="item"><span class="ico">🖼</span>推广海报</a>
    </div>

    <div class="m-card-block" style="margin-top:14px;">
      <div style="padding:12px 14px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:600; font-size:13px;">我的团队</span>
        <span style="font-size:11.5px; color:var(--text-muted);">一级 8人 · 二级 4人</span>
      </div>
      <div class="team-item"><div class="team-avatar">刘</div><div style="flex:1;"><div style="font-size:12.5px;">刘思琪</div><div style="font-size:11px; color:var(--text-muted);">一级 · 2026-06-18加入</div></div><div style="font-size:12px; color:var(--price);">贡献 ¥846</div></div>
      <div class="team-item"><div class="team-avatar" style="background:linear-gradient(135deg,#1baf7a,#2a78d6);">周</div><div style="flex:1;"><div style="font-size:12.5px;">周雨萱</div><div style="font-size:11px; color:var(--text-muted);">一级 · 2026-07-02加入</div></div><div style="font-size:12px; color:var(--price);">贡献 ¥120</div></div>
      <div class="team-item" style="border-bottom:none;"><div class="team-avatar" style="background:linear-gradient(135deg,#eda100,#e87ba4);">李</div><div style="flex:1;"><div style="font-size:12.5px;">李明</div><div style="font-size:11px; color:var(--text-muted);">二级 · 2026-07-20加入</div></div><div style="font-size:12px; color:var(--price);">贡献 ¥42</div></div>
    </div>

    <div class="m-card-block">
      <div style="padding:12px 14px; font-weight:600; font-size:13px;">佣金明细</div>
      <div class="m-cell"><div class="l">订单20260810049231 · 一级佣金</div><div class="r strong" style="color:var(--price);">+¥19.90</div></div>
      <div class="m-cell"><div class="l">订单20260809048902 · 二级佣金</div><div class="r strong" style="color:var(--price);">+¥3.00</div></div>
      <div class="m-cell" style="border-bottom:none;"><div class="l">提现申请</div><div class="r strong">-¥500.00</div></div>
    </div>
  </div>

  <div class="m-bottom-bar">
    <button class="m-btn m-btn-warm" style="flex:1;">立即申请提现</button>
  </div>
</div></div>
</body>
</html>
