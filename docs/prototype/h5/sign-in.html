<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日签到</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .sign-hero { background:linear-gradient(135deg,#ff9143,#e34948); color:#fff; padding:18px 16px 24px; text-align:center; }
  .sign-hero .n { font-size:22px; font-weight:800; }
  .sign-week { display:flex; justify-content:space-between; padding:16px 14px; background:#fff; margin:-10px 14px 0; border-radius:10px; box-shadow:var(--shadow-sm); position:relative; z-index:2; }
  .sign-day { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:10.5px; color:var(--text-muted); }
  .sign-day .dot { width:32px; height:32px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:13px; }
  .sign-day.done .dot { background:var(--status-good-bg); color:var(--status-good-text); }
  .sign-day.today .dot { background:var(--price); color:#fff; font-weight:700; }
  .sign-day.today { color:var(--price); font-weight:600; }
  .reward-row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--gridline); }
  .reward-ico { width:36px;height:36px;border-radius:8px;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;font-size:16px; flex-shrink:0; }
</style>
</head>
<body>
<div class="phone-wrap"><div class="phone">
  <div class="phone-statusbar"><span>9:41</span><span>●●● 5G 🔋</span></div>
  <div class="m-navbar"><span class="back" onclick="history.back()">‹</span>每日签到</div>

  <div class="phone-body">
    <div class="sign-hero">
      <div style="font-size:12px; opacity:.9;">已连续签到</div>
      <div class="n">3 天</div>
    </div>

    <div class="sign-week">
      <div class="sign-day done"><div class="dot">✓</div>周一</div>
      <div class="sign-day done"><div class="dot">✓</div>周二</div>
      <div class="sign-day today"><div class="dot">+2</div>周三</div>
      <div class="sign-day"><div class="dot">+2</div>周四</div>
      <div class="sign-day"><div class="dot">+2</div>周五</div>
      <div class="sign-day"><div class="dot">+3</div>周六</div>
      <div class="sign-day"><div class="dot">🎁</div>周日</div>
    </div>

    <div style="padding:20px 14px 10px; text-align:center;">
      <button class="m-btn m-btn-warm" style="width:200px;">立即签到 +2积分</button>
    </div>

    <div class="m-card-block">
      <div style="padding:12px 14px; font-weight:600; font-size:13px;">连续签到奖励</div>
      <div class="reward-row"><div class="reward-ico">🎯</div><div style="flex:1; font-size:12.5px;">连续3天</div><div style="font-size:12px; color:var(--text-muted);">已获得 +5积分</div></div>
      <div class="reward-row"><div class="reward-ico">🎯</div><div style="flex:1; font-size:12.5px;">连续7天</div><div style="font-size:12px; color:var(--price);">满199券一张</div></div>
      <div class="reward-row" style="border-bottom:none;"><div class="reward-ico">🎯</div><div style="flex:1; font-size:12.5px;">连续30天</div><div style="font-size:12px; color:var(--price);">50积分+专属勋章</div></div>
    </div>

    <div class="m-card-block">
      <div style="padding:14px; font-size:12px; color:var(--text-secondary); line-height:1.8;">
        签到规则：每日签到可获得积分奖励，连续签到奖励更丰厚；断签后连续天数将重新计算，当日可使用「补签卡」恢复连续记录。
      </div>
    </div>
  </div>

  <div class="m-tabbar">
    <a href="home.html"><span class="ico">⌂</span>首页</a>
    <a><span class="ico">▦</span>分类</a>
    <a href="cart.html"><span class="ico">🛒</span>购物车</a>
    <a href="my.html"><span class="ico">☺</span>我的</a>
  </div>
</div></div>
</body>
</html>
