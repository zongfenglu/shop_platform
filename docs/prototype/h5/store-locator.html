<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选择门店</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .store-item { display:flex; gap:12px; background:#fff; margin:10px 14px; border-radius:10px; padding:14px; box-shadow:var(--shadow-sm); }
  .store-item.selected { box-shadow:0 0 0 2px var(--primary); }
  .store-ico { width:44px;height:44px;border-radius:10px; background:var(--primary-bg); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .store-name { font-size:13.5px; font-weight:600; }
  .store-addr { font-size:11.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
  .store-meta { display:flex; gap:12px; font-size:11px; color:var(--text-secondary); margin-top:6px; }
</style>
</head>
<body>
<div class="phone-wrap"><div class="phone">
  <div class="phone-statusbar"><span>9:41</span><span>●●● 5G 🔋</span></div>
  <div class="m-navbar"><span class="back" onclick="history.back()">‹</span>选择自提门店</div>
  <div class="m-search">📍 当前定位：杭州市西湖区</div>

  <div class="phone-body">
    <div class="store-item selected" onclick="selectStore(this)">
      <div class="store-ico">🏬</div>
      <div style="flex:1;">
        <div class="store-name">花间集(西湖银泰店)</div>
        <div class="store-addr">浙江省杭州市西湖区龙翔路1号银泰百货3F</div>
        <div class="store-meta"><span>距您 320m</span><span>营业中 10:00-22:00</span></div>
      </div>
      <div style="align-self:center; color:var(--primary); font-size:16px;">✓</div>
    </div>

    <div class="store-item" onclick="selectStore(this)">
      <div class="store-ico">🏬</div>
      <div style="flex:1;">
        <div class="store-name">花间集(万象城店)</div>
        <div class="store-addr">浙江省杭州市江干区新塘路1号万象城1F</div>
        <div class="store-meta"><span>距您 4.2km</span><span>营业中 10:00-22:00</span></div>
      </div>
    </div>

    <div class="store-item" style="opacity:.5;">
      <div class="store-ico">🏬</div>
      <div style="flex:1;">
        <div class="store-name">花间集(城西银泰店)</div>
        <div class="store-addr">浙江省杭州市拱墅区莫干山路1号</div>
        <div class="store-meta"><span>距您 8.6km</span><span style="color:var(--status-critical);">已打烊</span></div>
      </div>
    </div>
  </div>

  <div class="m-bottom-bar">
    <button class="m-btn m-btn-warm" style="flex:1;" onclick="location.href='checkout.html'">确认选择该门店</button>
  </div>
</div></div>

<script>
  function selectStore(el) {
    document.querySelectorAll('.store-item').forEach(s => { s.classList.remove('selected'); const c=s.querySelector('div[style*="color:var(--primary)"]'); if(c) c.remove(); });
    el.classList.add('selected');
    el.insertAdjacentHTML('beforeend', '<div style="align-self:center; color:var(--primary); font-size:16px;">✓</div>');
  }
</script>
</body>
</html>
