<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>商户后台登录 - 花间集女装旗舰店</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/theme.js"></script>
<style>
  body { background: linear-gradient(160deg, #fff4ec 0%, #fbe9e5 50%, #f3ddd8 100%); min-height: 100vh; }
  html[data-theme="graphite"] body, html[data-theme="ocean"] body { background: linear-gradient(160deg, var(--page-bg) 0%, var(--surface-2) 100%); }
  .login-wrap { display: flex; min-height: 100vh; align-items: center; justify-content: center; position: relative; }
  .login-box { width: 380px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-modal); padding: 36px 32px; }
  .login-logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg,#ff9143,#e34948); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; margin-bottom: 16px; }
  .login-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .login-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 26px; }
  .login-theme-switcher { position: absolute; top: 24px; right: 24px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-theme-switcher" data-theme-switcher></div>
    <div class="login-box">
      <div class="login-logo">花</div>
      <div class="login-title">花间集女装旗舰店</div>
      <div class="login-sub">商户管理后台 · huajianji.shop.com/store</div>
      <div class="form-item">
        <label class="form-label"><span class="req">*</span>账号</label>
        <input class="form-input" value="huajianji_admin" />
      </div>
      <div class="form-item">
        <label class="form-label"><span class="req">*</span>密码</label>
        <input class="form-input" type="password" value="••••••••" />
      </div>
      <a href="dashboard.html" class="btn btn-primary btn-block" style="height:38px;margin-top:6px;background:linear-gradient(135deg,#ff9143,#e34948);border:none;">登 录</a>
      <div class="form-hint" style="text-align:center;margin-top:14px;">演示环境 · 直接点击登录即可进入</div>
    </div>
  </div>
</body>
</html>
