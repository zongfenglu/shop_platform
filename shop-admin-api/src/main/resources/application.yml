server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: shop-admin-api
  flyway:
    enabled: true  # shop-admin-api 是唯一负责跑 Flyway 迁移的应用，其余应用(store/client/job)已显式禁用，避免并发迁移冲突
    encoding: UTF-8
    detect-encoding: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:shop_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:wchabc123!!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本地开发的 redis 容器没设密码，留空即可；生产 compose 强制要求 REDIS_PASSWORD
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

shop:
  storage:
    local-dir: ${STORAGE_DIR:./data/uploads}
  backup:
    dir: ${BACKUP_DIR:./data/backups}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_ENV_this_is_a_dev_only_default_secret_key}
    expire-hours: 12
  platform:
    base-domain: ${PLATFORM_BASE_DOMAIN:shop.com}
  store-console-url: ${STORE_CONSOLE_URL:http://localhost:5174}
  domain:
    skip-cname: ${DOMAIN_SKIP_CNAME:true}
  crypto:
    aes-key: ${AES_KEY:CHANGE_ME_IN_PRODUCTION_ENV_this_is_a_dev_only_default_aes_key}
  acme:
    enabled: ${ACME_ENABLED:false}
    directory-url: ${ACME_DIRECTORY_URL:https://acme-staging-v02.api.letsencrypt.org/directory}
    email: ${ACME_EMAIL:}
    cert-dir: ${ACME_CERT_DIR:./data/certs}
    reload-command: ${ACME_RELOAD_COMMAND:}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: shop-admin-api-producer

logging:
  level:
    com.shopplatform: DEBUG

management:
  endpoints:
    web:
      exposure:
        # 只暴露 health：默认放开的 env/configprops/beans 会泄露数据库密码、JWT secret、
        # 微信支付商户凭证等，容器里这些都是环境变量注入的，等于把密钥挂在公网端点上。
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # 容器编排只关心"进程是否活着 + 依赖是否可用"，readiness 探针交给 compose healthcheck。
    defaults:
      enabled: true
