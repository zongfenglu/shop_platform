<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商户管理后台</title>
  <script>
    // 内联提前应用主题，避免刷新时先渲染浅色再跳深色的闪烁（与原型 shared/theme.js 同一 key）
    try {
      var t = localStorage.getItem('shop_theme')
      if (t && t !== 'white') document.documentElement.setAttribute('data-theme', t)
    } catch (e) {}
    // 高德 JS API 必须在脚本加载前拿到安全密钥；新版控制台没有域名白名单。
    window._AMapSecurityConfig = { securityJsCode: 'e773074f110402b905245336232c9ffb' }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
